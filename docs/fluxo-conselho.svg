<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="'IBM Plex Sans','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow-claude" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a55c"/>
    </marker>
    <marker id="arrow-openai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fa9c9"/>
    </marker>
    <marker id="arrow-nvidia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9dbb4f"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86806f"/>
    </marker>
    <marker id="arrow-leader" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fae76"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="1000" fill="#0c0b09"/>

  <text x="720" y="40" text-anchor="middle" font-size="26" font-weight="600" fill="#f2ece0">Quorum — Fluxo do Conselho</text>
  <text x="720" y="63" text-anchor="middle" font-size="13" fill="#86806f">kickoff do Líder monta o brief → 3 grupos rodam o MESMO brief em paralelo → cada grupo tem juiz próprio → Líder cruza os 3 e sintetiza</text>

  <!-- ===== Kickoff / Brief ===== -->
  <g>
    <rect x="505" y="86" width="430" height="86" rx="8" fill="#121109" stroke="#8fae76" stroke-width="1.4"/>
    <rect x="505" y="86" width="5" height="86" rx="2" fill="#8fae76"/>
    <text x="527" y="112" font-size="15" font-weight="600" fill="#f2ece0">Líder — Kickoff</text>
    <text x="527" y="131" font-size="11" fill="#b5ad9d">Opus 5 · pesquisa rápida no código (e contexto extra, se houver)</text>
    <text x="527" y="149" font-size="11" fill="#86806f">Monta o brief que os 3 grupos recebem como tarefa — isso É a</text>
    <text x="527" y="164" font-size="11" fill="#86806f">liberação da rodada, sem gate humano no meio</text>
  </g>

  <path d="M627,172 C627,196 300,196 255,210" stroke="#8fae76" stroke-width="1.4" fill="none" marker-end="url(#arrow-leader)"/>
  <path d="M720,172 L720,210" stroke="#8fae76" stroke-width="1.4" fill="none" marker-end="url(#arrow-leader)"/>
  <path d="M813,172 C813,196 1140,196 1185,210" stroke="#8fae76" stroke-width="1.4" fill="none" marker-end="url(#arrow-leader)"/>
  <text x="720" y="192" text-anchor="middle" font-size="10" fill="#6b8a5c" font-style="italic">mesmo brief pros 3 grupos</text>

  <!-- ===== Linha 1: grupos de especialistas (paralelo) ===== -->
  <g>
    <rect x="40" y="214" width="430" height="148" rx="8" fill="#121109" stroke="#2c2921"/>
    <rect x="40" y="214" width="5" height="148" rx="2" fill="#e0a55c"/>
    <text x="62" y="240" font-size="17" font-weight="600" fill="#e0a55c">Grupo Claude</text>
    <text x="62" y="259" font-size="12" fill="#b5ad9d">6 especialistas · Sonnet 5 · Read/Grep/Glob</text>
    <text x="62" y="281" font-size="11" fill="#86806f">arquitetura · segurança · regras de negócio</text>
    <text x="62" y="298" font-size="11" fill="#86806f">bug hunter · engenharia de software · dados</text>
    <text x="62" y="322" font-size="10.5" fill="#6b8a5c">via `claude -p` (claude-code-local) — assinatura</text>
    <text x="62" y="337" font-size="10.5" fill="#6b8a5c">Claude Code, sem custo de API</text>
    <text x="62" y="354" font-size="10" fill="#605a4f" font-style="italic">fallback: claude-api (Messages API, cobra por token)</text>
  </g>

  <g>
    <rect x="505" y="214" width="430" height="148" rx="8" fill="#110f0b" stroke="#2c2921"/>
    <rect x="505" y="214" width="5" height="148" rx="2" fill="#7fa9c9"/>
    <text x="527" y="240" font-size="17" font-weight="600" fill="#7fa9c9">Grupo OpenAI / Codex</text>
    <text x="527" y="259" font-size="12" fill="#b5ad9d">6 especialistas · GPT-5.6 Terra/Luna</text>
    <text x="527" y="281" font-size="11" fill="#86806f">mesmas 6 lentes espelhadas do Grupo Claude</text>
    <text x="527" y="298" font-size="11" fill="#86806f">(mesmo tópico, ângulo de fornecedor diferente)</text>
    <text x="527" y="322" font-size="10.5" fill="#5f84a3">via `codex exec` (codex-local) — assinatura</text>
    <text x="527" y="337" font-size="10.5" fill="#5f84a3">ChatGPT/Codex, sem custo de API</text>
    <text x="527" y="354" font-size="10" fill="#605a4f" font-style="italic">fallback: openai-api (Responses API, cobra por token)</text>
  </g>

  <g>
    <rect x="970" y="214" width="430" height="148" rx="8" fill="#0f110b" stroke="#2c2921"/>
    <rect x="970" y="214" width="5" height="148" rx="2" fill="#9dbb4f"/>
    <text x="992" y="240" font-size="17" font-weight="600" fill="#9dbb4f">Grupo NVIDIA / Hermes</text>
    <text x="992" y="259" font-size="12" fill="#b5ad9d">1 especialista · Nemotron 3 Super 120B</text>
    <text x="992" y="281" font-size="11" fill="#86806f">documentação &amp; legibilidade — escopo básico</text>
    <text x="992" y="298" font-size="11" fill="#86806f">fornecedor independente (reduz viés Claude/OpenAI)</text>
    <text x="992" y="322" font-size="10.5" fill="#7a9a48">via plano free NVIDIA NIM</text>
    <text x="992" y="337" font-size="10.5" fill="#7a9a48">40 req/min, sem custo por token</text>
    <text x="992" y="354" font-size="10" fill="#605a4f" font-style="italic">chave ausente → agente marca "pulado", rodada segue</text>
  </g>

  <!-- ===== Setas linha 1 → juízes ===== -->
  <path d="M255,362 L255,394" stroke="#e0a55c" stroke-width="1.6" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M720,362 L720,394" stroke="#7fa9c9" stroke-width="1.6" fill="none" marker-end="url(#arrow-openai)"/>
  <path d="M1185,362 L1185,394" stroke="#9dbb4f" stroke-width="1.6" fill="none" marker-end="url(#arrow-nvidia)"/>

  <!-- ===== Linha 2: um juiz por grupo — os 3 lados agora são simétricos ===== -->
  <g>
    <rect x="40" y="398" width="430" height="88" rx="8" fill="#121109" stroke="#e0a55c" stroke-width="1.2"/>
    <text x="62" y="425" font-size="15" font-weight="600" fill="#f2ece0">Juiz Claude</text>
    <text x="62" y="444" font-size="11" fill="#b5ad9d">Opus 5 · relê o código, não confia cego no relatório</text>
    <text x="62" y="461" font-size="11" fill="#86806f">Consolida os 6 relatórios, descarta baixa confiança</text>
    <text x="62" y="477" font-size="10" fill="#605a4f" font-style="italic">também julga o helper (mutual-aid) se um especialista travou</text>
  </g>

  <g>
    <rect x="505" y="398" width="430" height="88" rx="8" fill="#110f0b" stroke="#7fa9c9" stroke-width="1.2"/>
    <text x="527" y="425" font-size="15" font-weight="600" fill="#f2ece0">Juiz OpenAI</text>
    <text x="527" y="444" font-size="11" fill="#b5ad9d">GPT-5.6 Sol · relê o código antes de aceitar achado</text>
    <text x="527" y="461" font-size="11" fill="#86806f">Consolida os 6 relatórios GPT/Codex</text>
    <text x="527" y="477" font-size="10" fill="#605a4f" font-style="italic">mesma regra de confiança/evidência dos outros dois juízes</text>
  </g>

  <g>
    <rect x="970" y="398" width="430" height="88" rx="8" fill="#0f110b" stroke="#9dbb4f" stroke-width="1.2"/>
    <text x="992" y="425" font-size="15" font-weight="600" fill="#f2ece0">Juiz NVIDIA</text>
    <text x="992" y="444" font-size="11" fill="#b5ad9d">Sonnet 5 · filtra e confirma (normalmente só 1 relatório)</text>
    <text x="992" y="461" font-size="11" fill="#86806f">Hermes roda modelo bem menor — checagem mais cautelosa</text>
    <text x="992" y="477" font-size="10" fill="#605a4f" font-style="italic">antes um único juiz — hoje simétrico com os outros dois lados</text>
  </g>

  <!-- ===== Convergência dos 3 juízes → Líder ===== -->
  <path d="M255,486 C255,540 500,566 570,580" stroke="#e0a55c" stroke-width="1.4" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M720,486 L720,580" stroke="#7fa9c9" stroke-width="1.6" fill="none" marker-end="url(#arrow-openai)"/>
  <path d="M1185,486 C1185,540 940,566 870,580" stroke="#9dbb4f" stroke-width="1.4" fill="none" marker-end="url(#arrow-nvidia)"/>
  <text x="720" y="514" text-anchor="middle" font-size="10" fill="#86806f" font-style="italic">3 relatórios consolidados — um por lado</text>

  <!-- ===== Líder / Sintetizador ===== -->
  <g>
    <rect x="505" y="584" width="430" height="120" rx="8" fill="#121109" stroke="#8fae76" stroke-width="1.6"/>
    <rect x="505" y="584" width="5" height="120" rx="2" fill="#8fae76"/>
    <text x="527" y="612" font-size="17" font-weight="600" fill="#f2ece0">Líder / Sintetizador</text>
    <text x="527" y="631" font-size="11" fill="#b5ad9d">Opus 5 · relê o código antes de aceitar achado de risco alto</text>
    <text x="527" y="652" font-size="11" fill="#86806f">Cruza os 3 lados — isto SUBSTITUIU a etapa separada de</text>
    <text x="527" y="668" font-size="11" fill="#86806f">"verificação adversarial" que existia antes</text>
    <text x="527" y="686" font-size="10.5" fill="#8a7fc9" font-style="italic">divergência de FATO: resolve sozinho · divergência de</text>
    <text x="527" y="699" font-size="10.5" fill="#8a7fc9" font-style="italic">DECISÃO: nunca decide — vai pro usuário</text>
  </g>

  <!-- ===== Seta Líder → Relatório Final ===== -->
  <path d="M720,704 L720,736" stroke="#8fae76" stroke-width="1.8" fill="none" marker-end="url(#arrow-leader)"/>

  <!-- ===== Relatório Final ===== -->
  <g>
    <rect x="430" y="740" width="580" height="132" rx="8" fill="#121109" stroke="#e6e0d4" stroke-width="1.2"/>
    <text x="452" y="766" font-size="17" font-weight="600" fill="#f2ece0">Relatório Final</text>
    <text x="452" y="788" font-size="12" fill="#b5ad9d">Headline + lede — resumo executivo em 1 parágrafo</text>
    <text x="452" y="807" font-size="12" fill="#d4694a">P0 · BLOQUEIA — precisa de ação antes de seguir</text>
    <text x="452" y="826" font-size="12" fill="#d99b52">P1 · ALTO RETORNO — vale a pena, não é urgente</text>
    <text x="452" y="845" font-size="12" fill="#605a4f">DESCARTADO — com motivo, nunca silenciosamente</text>
    <text x="452" y="864" font-size="12" fill="#8a7fc9">Divergência não resolvida — pergunta exata pro usuário</text>
  </g>

  <!-- ===== Painel ao vivo ===== -->
  <path d="M720,872 L720,900" stroke="#605a4f" stroke-width="1.4" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow-neutral)"/>
  <g>
    <rect x="520" y="904" width="400" height="58" rx="6" fill="#0e0d0a" stroke="#33302a" stroke-dasharray="4,4"/>
    <text x="720" y="927" text-anchor="middle" font-size="13" fill="#e6e0d4">Painel ao vivo — localhost:7331</text>
    <text x="720" y="946" text-anchor="middle" font-size="11" fill="#86806f">dashboard/server.js dá spawn de `node orchestrate.js` por rodada ·</text>
  </g>
  <text x="720" y="978" text-anchor="middle" font-size="11" fill="#86806f">runs/&lt;id&gt;/state.json escrito pelo orchestrate.js, painel faz polling a cada 3s</text>
</svg>
